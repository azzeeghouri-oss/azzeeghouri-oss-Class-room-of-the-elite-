name: Build and Publish Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build web assets
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 21 ]; then
            echo "Error: Java 21 or higher required."
            exit 1
          fi

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Debug keystore created successfully."
          fi

      - name: Set executable permissions for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found at $APK_PATH. Searching inside android/app/build/outputs/apk:"
            find android/app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          echo "APK successfully verified at $APK_PATH."
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR=$(mktemp -d)
          ORIGINAL_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          REPO_CLEAN=$(echo "${{ github.repository }}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          ASSET_NAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          cp "$ORIGINAL_APK" "${RUNNER_TMP_DIR}/${ASSET_NAME}"
          echo "asset_path=${RUNNER_TMP_DIR}/${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared: ${RUNNER_TMP_DIR}/${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Ayanokoji System Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          
          NOTES=$(cat <<EOF
          ### White Room Protocol — Android Debug APK Release
          - **Build Run:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Commit:** ${{ github.sha }}
          - **Asset:** \`${{ steps.prepare_asset.outputs.asset_name }}\`
          
          #### How to install:
          1. Download the \`.apk\` file below under **Assets**.
          2. Open it on your Android device to install.
          EOF
          )
          
          gh release create "$TAG" \
            "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "### 🚀 APK Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK has been built and attached to GitHub Releases." >> $GITHUB_STEP_SUMMARY
            echo "**Release Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "**Download APK:** Go to the [Releases page](https://github.com/${{ github.repository }}/releases) and download \`${{ steps.prepare_asset.outputs.asset_name }}\` from the Assets list." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ APK Build Succeeded (Artifact Available)" >> $GITHUB_STEP_SUMMARY
            echo "The APK was successfully built and uploaded as a GitHub Actions workflow artifact (\`app-debug-apk\`)." >> $GITHUB_STEP_SUMMARY
            echo "Download it directly from the Summary artifacts section of this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
